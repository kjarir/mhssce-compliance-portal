<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Anjuman's Compliance Portal - AICP</title>
    <meta name="description" content="Centralized institutional compliance tracking and approval portal for Anjuman-I-Islam institutes." />
    <meta name="author" content="Anjuman-I-Islam" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var _warn = console.warn;
        var _error = console.error;
        var _log = console.log;
        
        function isExtensionNoise(args) {
          try {
            var msg = Array.prototype.slice.call(args).map(function(a) {
              return typeof a === 'string' ? a : (a && a.stack ? a.stack : JSON.stringify(a));
            }).join(' ');
            return (
              msg.indexOf('MaxListenersExceededWarning') !== -1 ||
              msg.indexOf('ObjectMultiplex') !== -1 ||
              msg.indexOf('contentscript') !== -1 ||
              msg.indexOf('app-init-liveness') !== -1 ||
              msg.indexOf('background-liveness') !== -1
            );
          } catch(e) { return false; }
        }

        console.warn = function() {
          if (isExtensionNoise(arguments)) return;
          _warn.apply(console, arguments);
        };
        console.error = function() {
          if (isExtensionNoise(arguments)) return;
          _error.apply(console, arguments);
        };
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
